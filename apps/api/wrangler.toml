name = "unbent-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# Better Auth reaches for node crypto; the Worker needs the node compat layer.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "unbent"
# Still a placeholder, and correctly so: development runs `--local`, against the SQLite
# file under .wrangler, and never reaches a remote database. Do not paste a real id here —
# it would not be used, and it would disagree with `database_name` above. Every real id
# lives in a named environment below, where a deploy actually needs it:
# [[env.production.d1_databases]] for `unbent`, [[env.dev.d1_databases]] for `unbent-dev`.
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-blobs"

[vars]
# Overridden per-environment; the SPA origin for OAuth redirects and cookie scope.
APP_URL = "http://localhost:5173"

# The SPA is served by this same Worker, so "same-origin" is structural rather than a
# routing rule that has to be kept correct in a dashboard. Session cookies and OAuth
# callbacks then need no CORS or SameSite workarounds.
[assets]
directory = "../web/dist"
binding = "ASSETS"
# Real paths (/notes/:id, /trash) have no matching asset, so an unmatched path must
# serve index.html and let the router resolve it.
not_found_handling = "single-page-application"
# Scopes the Worker to the API, which is what lets the SPA fallback reach everything else.
# Verified by removing it: /notes/:id and /trash then return Hono's JSON 404 instead of
# index.html, because a Worker with a catch-all notFound() answers every path itself and
# not_found_handling never gets a chance to fire. The API is unaffected either way.
run_worker_first = ["/api/*"]

# Production.
#
# A named environment rather than edited top-level values, so `wrangler dev` keeps using
# the localhost settings above and deploying can never silently pick up a dev APP_URL —
# `auth.ts` keys secure cookies off that string, so getting it wrong breaks every session
# in a way that only shows up after deploy.
#
# Deploy with: pnpm build && wrangler deploy --env production
[env.production]
name = "unbent-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "unbent"
database_id = "40559d4d-f327-45d0-99f6-0e560b32200c"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-blobs"

[env.production.vars]
APP_URL = "https://unbent.app"

# The apex serves both the SPA and /api, keeping them same-origin in production exactly as
# they are in dev. `custom_domain` makes Cloudflare create and manage the DNS record and
# certificate, so there is no separate record to keep in step with this file.
[[env.production.routes]]
pattern = "unbent.app"
custom_domain = true

[env.production.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.production.observability]
enabled = true

# Workers AI, for extracting a PDF's text on upload (see lib/extract-text.ts). Production
# only, deliberately: a `wrangler dev` with this binding reaches the real service and needs
# a Cloudflare login to start, which a self-hoster's first `pnpm dev` and the test suite
# should not depend on. Without it the browser extracts, as it always has. To try the
# server path locally, add the same two lines at the top level for the session and run
# `wrangler dev` logged in; conversion of a PDF is free.
[env.production.ai]
binding = "AI"

# Preview instance, shared by every pull request.
#
# One Worker per PR, `unbent-pr-<N>`, and all of them bound to the same `unbent-dev` D1 and
# `unbent-dev-blobs` R2. The Worker is per PR only because its URL — and therefore APP_URL —
# has to differ; the data is shared on purpose. Nothing here touches production. Deployed
# and torn down by .github/workflows/web.yml.
#
# Two values this block deliberately omits, because both are per PR and are supplied on the
# deploy command line instead:
#
#   --name unbent-pr-<N>   replaces the name outright (wrangler's getScriptName is
#                          `args.name ?? config.name`), rather than suffixing the env onto
#                          it the way a bare `--env dev` would give `unbent-api-dev`.
#   --var APP_URL:<url>    https://unbent-pr-<N>.<subdomain>.workers.dev
#
# APP_URL is the one that matters: `auth.ts` derives baseURL, trusted origins, cookie
# security and the passkey rpID from it, so it must name the preview's own host. Left unset
# the Worker throws on its first request, which is the right failure — a stale placeholder
# would instead half-work, with sessions breaking in ways that look like anything but this.
#
# Because of that omission wrangler warns, on every deploy of this env, that the top-level
# `vars` is not inherited and should be added here. The warning is expected and its advice
# is wrong for this block specifically: pasting APP_URL in is what reintroduces the stale
# placeholder above. There is no way to have the value be per-PR and also silence it.
#
# No `ai` binding, for the reason the production block gives; previews extract a PDF's text
# in the browser, as an unconfigured instance always has.
[env.dev]
workers_dev = true

[[env.dev.d1_databases]]
binding = "DB"
database_name = "unbent-dev"
database_id = "40d2f47f-e7cf-4f8f-bdc7-be2cc587ead3"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-dev-blobs"

[env.dev.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.dev.observability]
enabled = true
