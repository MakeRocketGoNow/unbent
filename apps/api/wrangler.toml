# The Worker every deployment of Unbent runs, yours included.
#
# The top level of this file is the instance a bare `wrangler deploy` ships, and it is
# written so that a fork deploys it unchanged. Three things make that possible:
#
#   - Resources are named, never identified. `wrangler deploy` provisions a D1 database
#     and an R2 bucket with these names on the first deploy and connects to the existing
#     ones on every deploy after, so there is no id to paste and nothing here belongs to
#     one account. Names are per account, so keeping unbent.app's is fine. The per-account
#     note stores are Durable Objects, which need no provisioning at all: the class is
#     exported from the Worker, and the first request for a user creates theirs.
#   - There is no APP_URL. The Worker derives its origin from the request when none is
#     configured (see src/lib/app-url.ts), so an instance need not know its address before
#     its first deploy prints one. An operator who wants to pin a single origin sets it as
#     a secret, which survives deploys; a plain var would be replaced by the next one.
#   - There are no routes. A custom domain is attached in the dashboard, once, and a deploy
#     with no routes in its config leaves it alone. Putting a hostname here would make the
#     file name one deployment, which is exactly what it must not do.
#
# The named environments below are not for you. `local` is what `pnpm dev` runs, and `dev`
# and `preview` are unbent.app's own dev instance and pull-request previews; a fork ignores
# them, and the workflow that deploys them skips itself when their secrets are absent.
#
# Deploy with: pnpm build && wrangler deploy   (or `pnpm release` from the repo root)
name = "unbent-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# Better Auth reaches for node crypto; the Worker needs the node compat layer.
compatibility_flags = ["nodejs_compat"]

# On, and on purpose: with no routes in this file the workers.dev name is the only address
# a fresh deploy has, and a Deploy to Cloudflare button relies on it. An instance that also
# has a custom domain is then reachable on two origins, each its own front door with its
# own cookies and passkeys. Pinning APP_URL (see above) closes the second one: sign-in
# from any other hostname is refused as an untrusted origin, which is what unbent.app does.
workers_dev = true
# Off, for the same reason APP_URL gets pinned: a per-version preview URL is one more
# origin the Worker would answer on, and nothing here needs one. Wrangler turns them on by
# default whenever workers.dev is on, and says so on every deploy unless told.
preview_urls = false

[observability]
enabled = true

# Secrets a deploy must find on the Worker, or refuse. Only the one nothing can work
# without: Better Auth cannot sign a cookie without it, so a Worker missing it fails on its
# first request in a way that reads as a broken sign-in rather than a missing setting.
# Everything else (mail, providers, the allowlist, the operator) is optional by design;
# see .dev.vars.example for the whole list.
[secrets]
required = ["BETTER_AUTH_SECRET"]

[[d1_databases]]
binding = "DB"
database_name = "unbent"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-blobs"

# Workers AI, for extracting a PDF's text on upload (see lib/extract-text.ts). Deployed
# instances get it; `[env.local]` below deliberately does not, because a `wrangler dev`
# with this binding reaches the real service and needs a Cloudflare login to start, which
# a self-hoster's first `pnpm dev` and the test suite should not depend on. Without it the
# browser extracts, as it always has. Conversion of a PDF is free.
[ai]
binding = "AI"

# One SQLite-backed Durable Object per account, holding that account's notes; see
# src/store/user-store.ts and "Where your notes live" in docs/architecture.md. Nothing to
# provision: the class is exported from the Worker and the runtime creates each object the
# first time a user id names it. Unlike the bindings above this one is *not* copied into the
# named environments by wrangler, so each of them repeats it below, the same way they repeat
# D1 and R2. The migration block is inherited, so it appears once.
[[durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

# Declares the class SQLite-backed. `new_sqlite_classes` rather than `new_classes`: the
# key-value flavour has no `ctx.storage.sql`, and a class that has been deployed under one
# flavour cannot be moved to the other. Never remove this block, and never remove the
# class export while it stands: a deploy that drops an exported class needs a further
# migration with `deleted_sqlite_classes`, or wrangler refuses it. Do not add a declarative
# `exports` key beside this; it cannot coexist with `migrations`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserStore"]

# Two hourly jobs on one trigger, told apart by the minute (`scheduled` in src/index.ts).
#
# At :17, the walk over every account's note store (src/lib/sweep.ts): wakes each object
# so a pending migration runs and fails in the log rather than in front of its owner,
# records each account's size in the directory, finishes any deletion that was
# interrupted, and deletes the files whose thirty-five days are up. A batch of twenty
# accounts per run rather than all of them: every store call and D1 query counts against
# an invocation's subrequests, fifty on Workers Free, so the walk keeps its place in D1
# and continues each hour until a pass is done, then starts over.
#
# At :47, the daily dumps of every changed account into the backups bucket
# (src/lib/backups.ts), which do nothing at all where no `BACKUPS` bucket is bound: at
# this level, so on every fork. Half an hour from the sweep, and its own invocation, so
# each has the whole fifty to itself.
#
# Inherited by the named environments, which is right for `dev` and wrong for a preview
# that lives for one pull request; `[env.preview.triggers]` below switches it off there.
# The minutes are arbitrary; that they are thirty apart is not.
[triggers]
crons = ["17,47 * * * *"]

# The SPA is served by this same Worker, so "same-origin" is structural rather than a
# routing rule that has to be kept correct in a dashboard. Session cookies and OAuth
# callbacks then need no CORS or SameSite workarounds.
[assets]
directory = "../web/dist"
binding = "ASSETS"
# Real paths (/notes/:id, /trash) have no matching asset, so an unmatched path must
# serve index.html and let the router resolve it.
not_found_handling = "single-page-application"
# Scopes the Worker to the API, which is what lets the SPA fallback reach everything else.
# Verified by removing it: /notes/:id and /trash then return Hono's JSON 404 instead of
# index.html, because a Worker with a catch-all notFound() answers every path itself and
# not_found_handling never gets a chance to fire. The API is unaffected either way.
run_worker_first = [
  "/api/*",
  # Everything under .well-known is the Worker's: OAuth discovery, which an MCP client reads
  # from the origin root so it cannot live under /api, and the Android app-links document,
  # which is per deployment. Without this the SPA fallback answers each one with index.html
  # and a 200, which reads as a broken client rather than a routing mistake. Nothing static
  # lives under the prefix any more, so one entry covers it.
  "/.well-known/*",
  # PostHog's traffic, proxied so a content blocker does not drop it. Listed
  # unconditionally because this file cannot see POSTHOG_KEY; the route answers 404 on an
  # instance that has none, which is a truthful answer the SPA fallback could not give.
  "/ingest/*",
  # The web manifest, which names and draws the installed app: renamed and recoloured on
  # an instance that is not production, so its icon on a home screen is not mistaken for
  # the real one, and passed through untouched on production. See src/lib/manifest.ts.
  "/manifest.webmanifest",
  # The static copies of the story and the comparisons, which the build writes as why.html
  # and compare*.html and the Worker hands over with their addresses completed, only on an
  # instance with a front page; and what a crawler may read here, which an instance with
  # no front page answers with nothing. Each comparison by name rather than `/compare/*`:
  # a path the Worker is handed first and does not know is Hono's JSON 404, where the
  # asset layer would give the app's own not-found.
  # See src/lib/front-pages.ts. The front page, pricing and support are the shell, passed
  # through only so the link-preview picture in its head is a whole address.
  "/why",
  "/compare",
  "/compare/evernote",
  "/compare/notion",
  "/compare/joplin",
  "/",
  "/pricing",
  "/support",
  "/robots.txt",
  "/sitemap.xml",
]

# Local development: what `pnpm dev` and `migrate:local` run.
#
# A named environment so that `wrangler dev` never loads the deployable bindings above,
# and the difference is one binding: no Workers AI, for the reason given on it. Everything
# else is repeated rather than inherited because wrangler does not inherit bindings into
# an environment. It warns on every start about the two keys deliberately left behind,
# `ai` and `secrets`; both warnings are this block doing its job.
#
# The `database_id` is a placeholder, and correctly so: `--local` never reaches a remote
# database, and miniflare keys the SQLite file under .wrangler on this string, so changing
# it would make every checkout's local notes vanish into a fresh empty database.
[env.local]

[[env.local.d1_databases]]
binding = "DB"
database_name = "unbent"
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-blobs"

# A backups bucket locally too, in miniflare's own storage, so the load route and the
# operator page (MAK-171, parts 4 and 5) can be driven against a real dump rather than
# only refused. The cron that fills it never fires under `wrangler dev`, so it holds what
# a person puts there: `wrangler r2 object put unbent-backups/<key> --local --env local`.
# Dev and production bind theirs by name below and in the deploy workflow; a fork's
# top-level config still binds none, which is what keeps its :47 run a no-op.
[[env.local.r2_buckets]]
binding = "BACKUPS"
bucket_name = "unbent-backups"

[[env.local.durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[env.local.vars]
# The SPA origin for OAuth redirects and cookie scope. `pnpm dev` overrides it with the
# checkout's own port; this is the value a bare `wrangler dev --env local` gets.
APP_URL = "http://localhost:5173"
# In front of the tab title and on the favicon, so a local tab is never taken for
# production's (see `INSTANCE_LABEL` in src/types.ts).
INSTANCE_LABEL = "Local"
INSTANCE_KIND = "local"

# No `[env.local.secrets]`, and the omission is load-bearing. Once an environment declares
# `secrets`, `wrangler dev` loads from .dev.vars only the names that list contains and the
# vars above: every optional secret, an OAuth pair, a Resend key, the operator's name,
# silently stops reaching the Worker. Verified by watching GitHub vanish from the offered
# sign-in methods. Wrangler warns on every start that the top-level `secrets` was not
# inherited here; that warning, like the one for `ai`, is this block doing its job.

[env.local.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/.well-known/*",
  "/ingest/*",
  "/manifest.webmanifest",
  "/why",
  "/compare",
  "/compare/evernote",
  "/compare/notion",
  "/compare/joplin",
  "/",
  "/pricing",
  "/support",
  "/robots.txt",
  "/sitemap.xml",
]

# Preview instances, one per pull request. unbent.app's own; see the header.
#
# One Worker per PR, `unbent-pr-<N>`, all of them bound to the same `unbent-dev` D1,
# `unbent-dev-blobs` R2 and note stores that `[env.dev]` below serves. The Worker is per
# PR only because its URL (and therefore APP_URL) has to differ; the data is shared on
# purpose. Nothing here touches production. Deployed and torn down by
# .github/workflows/previews.yml.
#
# Named `preview` rather than `dev` because that is what it is. The dev *instance* is the
# block below: a Worker that outlives any one PR. Calling this one `dev` left the only
# thing anybody could reach living inside whichever PR happened to be open, and the shared
# database with no front door at all between merges.
#
# Two values this block deliberately omits, because both are per PR and are supplied on the
# deploy command line instead:
#
#   --name unbent-pr-<N>   replaces the name outright (wrangler's getScriptName is
#                          `args.name ?? config.name`), rather than suffixing the env onto
#                          it the way a bare `--env preview` would give `unbent-api-preview`.
#   --var APP_URL:<url>    https://unbent-pr-<N>.<subdomain>.workers.dev
#
# APP_URL is supplied rather than derived because every preview shares one database: with
# each Worker naming its own origin, a token or a passkey made on one preview cannot be
# replayed against another.
#
# Because of that omission wrangler warns, on every deploy of this env, that the top-level
# `vars` is not inherited and should be added here. The warning is expected and its advice
# is wrong for this block specifically. There is no way to have the value be per-PR and
# also silence it.
#
# No `ai` binding: previews extract a PDF's text in the browser, as an unconfigured
# instance always has. Wrangler warns about that omission too, on every preview deploy,
# beside the `vars` one above; both are expected.
#
# No routes either, and that is load-bearing: a route here would be claimed by whichever
# preview deployed last, since `--name` changes the script a deploy targets but not the
# hostname it attaches. The dev instance's custom domain therefore cannot live in a block
# that previews reuse.
[env.preview]
workers_dev = true

# A preview is a brand-new Worker on every PR, and a required secret has to be present
# when a new Worker is first deployed: `secret put` cannot manage that, since it needs a
# Worker to exist. The workflow therefore sends the secrets with the deploy itself, through
# `--secrets-file`, which is what lets this list be the real one rather than empty.
[env.preview.secrets]
required = ["BETTER_AUTH_SECRET"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "unbent-dev"
migrations_dir = "migrations"

[[env.preview.r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-dev-blobs"

# The dev instance's note stores, not the preview's own: `script_name` binds the class
# that the `unbent-dev` Worker exports, so a preview reads and writes the same objects
# dev.unbent.app does, and a note made on either is on both: what the shared D1 gave
# before the notes moved into per-account objects. Without it each preview Worker has a
# namespace of its own, empty, and the account you sign in with (the same user id, from
# the shared D1) finds no notes; that is how the cutover shipped, and nothing could fill
# it, since `seed:demo` refuses any host but loopback and the D1 rows a copy could have
# read are gone.
#
# The cost is that an object runs the code of the Worker that exports it. Every store
# call a preview makes here is answered by `main`'s `src/store/` (dev's deploy) and
# never the PR's, so a PR that changed a query would not be exercised on its preview, a
# method it adds would be missing, and a schema file it appends would never be applied.
# So a PR that touches `src/store/` does not get this line: the workflow deploys it from
# a copy of this file without `script_name`, with `PREVIEW_OWN_STORES=1`, and its preview
# has stores of its own running its own code. They start empty, and the page offers to
# fill them with the seed (`packages/seed/`). Measured over the PRs merged since
# mid-August, about one in five touched the note queries; the rest read the dev
# instance's notes. Either way a PR's store schema cannot reach dev's notes before it
# merges, the way a PR's D1 migration reaches dev's database.
#
# Previews still export `UserStore`, and the inherited migration block still declares it,
# so every preview Worker has a namespace of its own whether it reads it or not. That is
# what the store-changing previews use, and why dropping one line is all it takes.
#
# The sweep cron (top level) is inherited and switched off just below: dev's own sweep
# walks these objects, and a second walk running a PR's code would race it.
[[env.preview.durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"
script_name = "unbent-dev"

[env.preview.triggers]
crons = []

# A preview shares the dev instance's D1 and, unless its PR changes the store, its note
# stores too, so every row its sweep would write, drop or move in the account directory
# belongs to dev, and dev's own sweep already walks them. The sweep does nothing with this
# set (src/lib/sweep.ts). Off here and nowhere else.
[env.preview.vars]
STORE_SWEEP = "0"
# Every preview is one; its label, "PR <number>", comes from the deploy command.
INSTANCE_KIND = "preview"
# unbent.app's front page, so a PR that changes it can be seen before it ships. Production
# sets it as a secret rather than here, where a fork would inherit it (src/types.ts).
FRONT_PAGE = "1"
# Who runs it (`OPERATOR_NAME` and `OPERATOR_EMAIL`, so the built-in terms and privacy
# policy are published beside the price) comes from the `PREVIEW_OPERATOR_NAME` and
# `PREVIEW_OPERATOR_EMAIL` repository variables through the deploy command, never from
# here: a fork deploying previews of its own would otherwise publish this repository's
# operator on its pages (.github/workflows/previews.yml).

[env.preview.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/.well-known/*",
  "/ingest/*",
  "/manifest.webmanifest",
  "/why",
  "/compare",
  "/compare/evernote",
  "/compare/notion",
  "/compare/joplin",
  "/",
  "/pricing",
  "/support",
  "/robots.txt",
  "/sitemap.xml",
]

[env.preview.observability]
enabled = true

# The dev instance, at https://dev.unbent.app. unbent.app's own; see the header.
#
# One standing Worker, deployed from main by .github/workflows/previews.yml, on the same
# `unbent-dev` D1 and `unbent-dev-blobs` R2 the previews above use.
#
# It exists because a preview structurally cannot be a stable host. `auth.ts` derives the
# trusted origins and the passkey rpID from APP_URL, so a hostname that changes with every
# PR can never have an OAuth callback registered against it, and a passkey enrolled on one
# preview is useless on the next. Proving a sign-in flow end to end anywhere other than
# production needs a hostname that stays put, and until this block existed, production was
# the only instance in the world with one.
#
# Sharing the previews' data is deliberate. A second database would be another thing to
# migrate, recreate and reason about for a scratch environment nothing is backed up in, and
# it would cost the property that makes the shared instance worth having: a note made on a
# preview is there on dev, and the other way round. The trade is that a PR's migration
# lands here too, so this Worker can be briefly wrong for the code main is running. That is
# the same sharp edge the previews already have, and the README's recipe for recreating the
# instance is the same fix.
[env.dev]
# Replaces the name outright rather than suffixing the environment onto the top-level one,
# which would otherwise deploy this as `unbent-api-dev`. The previews' `USER_STORE` names
# this Worker by `script_name`, so a rename here strands them on stores that don't exist.
name = "unbent-dev"
# One hostname and one origin. A workers.dev URL alongside the custom domain would be a
# second origin that APP_URL does not name, so every sign-in through it would fail on an
# untrusted origin, a failure that reads as a broken deploy rather than the wrong URL.
workers_dev = false

[[env.dev.d1_databases]]
binding = "DB"
database_name = "unbent-dev"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BLOBS"
bucket_name = "unbent-dev-blobs"

# The daily dumps (src/lib/backups.ts, MAK-171), so the backup and its restore can be
# rehearsed on dev's accounts before production depends on them. The bucket and its
# fourteen-day lifecycle rule on `stores/` were made by hand, like production's. Previews
# get no binding and dump nothing: they share dev's directory, and dev's own run walks it.
[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "unbent-dev-backups"

[[env.dev.durable_objects.bindings]]
name = "USER_STORE"
class_name = "UserStore"

[env.dev.vars]
# Unlike a preview's, this one is a constant and belongs in the file: the host does not
# change, so there is nothing for a deploy to supply and nothing to go stale.
APP_URL = "https://dev.unbent.app"
# What the page calls this instance in its tab title, favicon and account menu. A
# preview's is per PR and comes from the deploy command instead.
INSTANCE_LABEL = "Dev"
INSTANCE_KIND = "dev"
# The front page, as production shows it; see the same line under the previews.
FRONT_PAGE = "1"

[env.dev.secrets]
required = ["BETTER_AUTH_SECRET"]

# `custom_domain` has Cloudflare create and manage both the DNS record and the certificate,
# so there is no record to keep in step with this file by hand. It needs `unbent.app` to be
# a zone on the same account and an API token with DNS edit on that zone.
[[env.dev.routes]]
pattern = "dev.unbent.app"
custom_domain = true

[env.dev.assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/*",
  "/.well-known/*",
  "/ingest/*",
  "/manifest.webmanifest",
  "/why",
  "/compare",
  "/compare/evernote",
  "/compare/notion",
  "/compare/joplin",
  "/",
  "/pricing",
  "/support",
  "/robots.txt",
  "/sitemap.xml",
]

[env.dev.observability]
enabled = true

# Extracts a PDF's text on the server, as a deployed instance does. A dev instance is only
# worth having if the path it exercises is production's, and text extraction is the half
# of an import that differs most between the two.
[env.dev.ai]
binding = "AI"
