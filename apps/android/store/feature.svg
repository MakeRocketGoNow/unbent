  </g>

  <text x="300" y="222" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Unbent</text>
  <text x="302" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400" fill="#CFE3D8">Markdown notes that stay yours</text>
  <text x="302" y="338" font-family="Menlo, DejaVu Sans Mono, monospace"
