[versions]
agp = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
browser = "1.10.0"
work = "2.12.0"
okhttp = "5.5.0"
coroutines = "1.11.0"
junit = "4.13.2"
robolectric = "4.16.1"
androidxTestCore = "1.7.0"
credentials = "1.6.0"
googleid = "1.2.0"
serialization = "1.11.0"
composeBom = "2026.09.00"
# Discontinued by Google — 1.7.8 is the final release, and the Compose BOM no longer
# carries it. The four icons the native screens still draw (back, close, and the capture
# sheet's two arrows) are all from the core set, so it stays pinned here rather than
# becoming a rewrite.
materialIcons = "1.7.8"
activityCompose = "1.13.0"
webkit = "1.17.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
# Credential Manager: Android's own account sheet, so Google sign-in shows no web page.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
# Compose. The BOM pins every androidx.compose artifact to one release, so only it has a version.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Versioned explicitly: no longer part of the BOM.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIcons" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# WebSettingsCompat: the WebView's dark mode below API 33, and passkeys inside it.
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
# Response models. Lenient decoding, so a field the server adds later cannot break an installed app.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
