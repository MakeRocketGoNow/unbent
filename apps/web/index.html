<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The stylesheet has a dark theme; this lets the browser's own controls follow it,
         and it is what a WebView reads to decide which scheme the page supports. -->
    <meta name="color-scheme" content="light dark" />
    <!-- The front page's title and description, and what the whole app shows until a page
         says otherwise: `src/page-meta.ts` rewrites these per route and `prerender.tsx`
         writes a page's own into its static copy. The card's picture is a site-relative
         path, which the Worker makes absolute for a prerendered page (`lib/front-pages.ts`)
         and the page itself makes absolute once it runs; a crawler reading this shell
         alone is one the Worker has already answered. -->
    <title>Unbent</title>
    <meta name="description" content="Notes, receipts and scans you can search, and take with you whenever you like." />
    <meta property="og:site_name" content="Unbent" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Unbent" />
    <meta property="og:description" content="Notes, receipts and scans you can search, and take with you whenever you like." />
    <meta property="og:image" content="/front/desktop-light.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Installable as an app. On desktop Chrome that also registers it as a handler for
         the file types in the manifest, which is what lets a scanner or Finder hand a
         file straight to it; see launch-files.ts for what happens when one arrives. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The colour of the chrome around the page. Installed, the title bar is the accent
         (the light theme's `--accent` in styles.css, in both themes), the way the app's
         own window has always been branded; it is the manifest's `theme_color` too, so
         the bar does not change colour as the page loads. In a browser tab the address
         bar takes the page's paper instead, since there the bar belongs to the browser
         and a band of brand colour above someone's tab is the app shouting. The first tag
         whose media matches wins, so the installed one comes first. -->
    <meta name="theme-color" content="#9c3f6d" media="(display-mode: standalone)" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16151a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The tab's icon. There was none, so a browser asked for /favicon.ico, which the
         SPA fallback answers with this page, and drew a blank. The PWA's own icon, which
         instance-marker.ts badges on an instance that is not production. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
