<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The stylesheet has a dark theme; this lets the browser's own controls follow it,
         and it is what a WebView reads to decide which scheme the page supports. -->
    <meta name="color-scheme" content="light dark" />
    <title>Unbent</title>
    <meta name="description" content="Notes in Markdown that you can always take with you." />
    <!-- Installable as an app. On desktop Chrome that also registers it as a handler for
         the file types in the manifest, which is what lets a scanner or Finder hand a
         file straight to it; see launch-files.ts for what happens when one arrives. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2F6B4F" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
