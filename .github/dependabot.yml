# Dependency updates.
#
# The reason this exists is the auth stack: Better Auth shipped three account-takeover
# advisories in short order, all fixed in patch releases, and the gap between a fix landing
# and someone noticing is the whole exposure. Whether security updates run at all is a
# repository setting rather than a file, but how they are *grouped* is set here — and
# grouping is the part that decides whether an advisory bump installs. Keeping ordinary
# versions current is what makes that bump a one-line diff instead of a migration.
#
# Version updates are off: every `open-pull-requests-limit` below is 0, which stops the
# weekly and monthly pull requests and leaves security updates alone (they are not counted
# against it). Dependabot proposes a version without knowing why one was chosen — it
# merged wa-sqlite 2 under an adapter that peers on 1 (#336) — so routine updates are done
# by hand, against DEPENDENCIES.md, which says which versions are held and why. The groups
# stay, because security pull requests are grouped by them.

version: 2
updates:
  # pnpm workspace: the members *and* the root, which is not the overlap it looks like.
  #
  # The root is where pnpm-lock.yaml lives, and the lockfile is the point. What the first
  # run demonstrated: a grouped update spanning directories rewrites the member manifests
  # and the lockfile together and passes CI, while an update scoped to one directory
  # rewrites that package.json alone — leaving `pnpm install --frozen-lockfile` to fail on
  # a lockfile that no longer agrees with it. All three single-package pull requests failed
  # exactly that way.
  #
  # Which is why every update type below is grouped, majors included. Grouping is not about
  # tidiness here; it is what keeps an update spanning directories, and therefore what keeps
  # the lockfile travelling with the manifests that need it.
  - package-ecosystem: npm
    directories:
      - '/'
      - '/apps/*'
      - '/packages/*'
    schedule:
      interval: weekly
    # Grouped, because ungrouped this is a dozen pull requests a week on a project with one
    # maintainer, and a queue nobody reads is the same as no updates at all. Auth is its own
    # group so a Better Auth bump arrives alone and legible rather than buried in a batch.
    #
    # A dependency only ever joins the first group whose patterns match, so the specific
    # groups precede the catch-alls within each `applies-to` scope.
    groups:
      auth:
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      # The service worker's toolchain, which has to move as one. `vite-plugin-pwa` writes
      # the precache list with its own `workbox-build`, and the worker imports Workbox's
      # runtime modules directly, pinned to that same version (apps/web/package.json). A
      # bump of either side alone would build a worker from two Workbox versions — the
      # core-versus-plugin skew the better-auth family taught this file to avoid.
      pwa:
        patterns:
          - 'vite-plugin-pwa'
          - 'workbox-*'
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Grouped rather than left to arrive singly, which is the only way they carry the
      # lockfile. It does mean majors land together and want reading together — but a
      # major that cannot install is not a reviewable pull request in the first place.
      major:
        update-types:
          - major
      # The groups above cover version updates only: `applies-to` defaults to
      # `version-updates`, so without these two the security pull requests — the ones this
      # file exists for — fall back to the repository-level default, which groups per
      # package manager *and directory*. That is the single-directory shape that broke
      # `--frozen-lockfile` three times above.
      auth-security:
        applies-to: security-updates
        patterns:
          - 'better-auth'
          - '@better-auth/*'
      security:
        applies-to: security-updates
        patterns:
          - '*'
    open-pull-requests-limit: 0
    # Not `@journeyapps/wa-sqlite` 2, until `@tanstack/browser-db-sqlite-persistence` peers
    # on it. The local library and the outbox open their SQLite file through that adapter,
    # which peers on ^1.4.1 (as of 0.2.32, 2026-10); pnpm installs a 2.x beside it with
    # only a peer warning, and what breaks is the persistence worker on every device, where
    # no unit test reaches. The bump was merged once (#336) and reverted. Lift this when the
    # adapter's peer range takes the new major, and run `pnpm gate:offline` on the bump.
    ignore:
      - dependency-name: '@journeyapps/wa-sqlite'
        update-types: ['version-update:semver-major']

  # Android. Gradle and AndroidX move on their own schedule and the app is built in CI.
  - package-ecosystem: gradle
    directory: '/apps/android'
    schedule:
      interval: monthly
    groups:
      # Compose BOM is `androidx.compose:compose-bom`, so it lands here too — which is what
      # we want, since the BOM is the thing that pins every Compose artifact.
      androidx:
        patterns:
          - 'androidx.*'
      # The three Kotlin plugins already share one version ref; this pulls the serialization
      # and coroutines runtimes along with them, which is the pairing the Kotlin
      # compatibility matrix actually cares about.
      kotlin:
        patterns:
          - 'org.jetbrains.kotlin*'
      # Everything else — okhttp, material, junit, robolectric, googleid, AGP. Matches last,
      # so the two groups above win. Grouped for the same reason the npm block gives: left
      # singly these are nine pull requests a month against a limit of four, and six of them
      # get dropped without saying which.
      gradle-rest:
        patterns:
          - '*'
      androidx-security:
        applies-to: security-updates
        patterns:
          - '*'
    open-pull-requests-limit: 0

  # The actions in .github/workflows, which are pinned by tag and otherwise never revisited.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
    open-pull-requests-limit: 0
