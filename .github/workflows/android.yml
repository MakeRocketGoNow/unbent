name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  # Cutting a release build on demand, without waiting for a push.
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    runs-on: ubuntu-latest
    # Every build that could reach Play needs a version code Play has not seen. The run
    # number only ever increases and is unique across the repository, so nothing has to be
    # remembered or bumped by hand. See `versionCode` in app/build.gradle.kts.
    env:
      UNBENT_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test

      # An unsigned build on every run proves the release path compiles. Signing only
      # happens when the keystore secret is present, so a fork's PR still builds.
      - run: ./gradlew bundleRelease assembleRelease

      # `secrets` cannot be read in an `if:`, so the presence check is an env var the
      # expression can see. A fork or a PR without the keystore still gets an unsigned build
      # rather than a failed run.
      - name: Sign release
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          UNBENT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UNBENT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UNBENT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNBENT_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      # Both formats, because they are for different places. Play takes only the bundle
      # and re-signs it per device; the APK is what `adb install` and a sideload take, and
      # is what the emulator instructions in AGENTS.md assume.
      - uses: actions/upload-artifact@v7
        with:
          name: unbent-android
          path: |
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
