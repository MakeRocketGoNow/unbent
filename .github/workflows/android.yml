name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  # Cutting a release build on demand, without waiting for a push.
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/android

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew test

      # An unsigned APK on every run proves the release path compiles. Signing only
      # happens when the keystore secret is present, so a fork's PR still builds.
      - run: ./gradlew assembleRelease

      # `secrets` cannot be read in an `if:`, so the presence check is an env var the
      # expression can see. A fork or a PR without the keystore still gets an unsigned APK
      # rather than a failed run.
      - name: Sign release
        if: github.event_name != 'pull_request' && env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          UNBENT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          UNBENT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          UNBENT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNBENT_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: unbent-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
