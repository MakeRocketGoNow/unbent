name: Web and API

# Checks every push and pull request, and ships `main` to production. This file is the
# whole of what a fork has to understand about deployment: two repository secrets and the
# `deploy` job. unbent.app's dev instance and pull-request previews live in previews.yml,
# which skips itself on a repository that has not been given their secrets.
#
# Pushes are path-filtered so an Android-only change does not redeploy the Worker. Pull
# requests always start the workflow and run only the jobs their files can reach; see the
# `changes` job and `ci`.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/store-tests/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web.yml'
  # Every pull request, with no `paths`: the `ci` job at the end is the one check the
  # ruleset on `main` requires, and a required check whose workflow never started is
  # waited for indefinitely — a docs-only or Android-only pull request could not merge.
  # What a pull request does not reach is skipped inside the workflow instead (`changes`).
  pull_request:

# A second push to a pull request makes the first one's checks pointless, so don't pay to
# finish them. Cancelling is scoped to pull requests deliberately: a push to `main` reaches
# the `deploy` job below, and two merges landing close together must both ship rather than
# the later one cancelling the earlier part-way through a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the two long test suites a pull request can affect. Together they were seven of
  # the job's nine minutes, and about half of pull requests touch only one side: a store
  # change sat through five minutes of web tests that could not have noticed it (two, now
  # that they are sharded), and a styling change through two minutes of Durable Object
  # tests.
  #
  # Decided here rather than by `paths` on a second workflow, because `paths` decides
  # whether a whole workflow runs, and `deploy` has to wait for every suite that did. A
  # small job of its own, rather than a first step in each suite's job, so a suite that has
  # nothing to check shows as skipped in the pull request's checks instead of as a green
  # tick that ran nothing — and so it costs no install. A push to `main` runs everything:
  # it is what deploys, and a merge carries every pull request since the last one.
  #
  # Everything else — typecheck, the API's unit tests, the seed's, the build — runs on
  # every change in `check`: together they are about a minute, and typecheck is what
  # catches an API change that breaks the web app, which imports the API's route types.
  changes:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.suites.outputs.any }}
      web: ${{ steps.suites.outputs.web }}
      store: ${{ steps.suites.outputs.store }}
    steps:
      # A pull request's checkout is the merge of its head into the base, so with two
      # commits of history the first parent is the base as it is now, and the diff between
      # them is exactly what merging would change — with no API call, and no limit on how
      # many files it can list. A diff that fails fails the job, rather than skipping a
      # suite on an answer nobody got.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Which suites does this change reach?
        id: suites
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "store=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          # What every package builds on. A change here reaches both suites.
          shared='packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.github/workflows/web\.yml$'
          # The web tests import no API code — only its types, which vitest strips and
          # typecheck covers. The store tests import from all over `apps/api/src`, not only
          # `store/`, so any API change reaches them.
          web=false
          store=false
          if printf '%s\n' "$changed" | grep -qE "^(apps/web/|$shared)"; then web=true; fi
          if printf '%s\n' "$changed" | grep -qE "^(apps/api/|apps/store-tests/|$shared)"; then store=true; fi
          # What `check` covers: anything the workspace builds from. A pull request that
          # touches none of it — docs, Android, iOS, other workflows — runs nothing here.
          any=false
          if printf '%s\n' "$changed" | grep -qE "^(apps/web/|apps/api/|apps/store-tests/|$shared)"; then any=true; fi
          echo "any=$any" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "store=$store" >> "$GITHUB_OUTPUT"
          [ "$web" = true ] || echo "No web, shared or root file changed — web tests skipped." >> "$GITHUB_STEP_SUMMARY"
          [ "$store" = true ] || echo "No API, store-test, shared or root file changed — store tests skipped." >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The API's unit tests only read a stubbed Env, so they run anywhere. Its `test`
      # script also drives a live wrangler dev with real D1 and R2, which does not run
      # here — that half stays local. See apps/api/test/README.md.
      - run: pnpm --filter @unbent/api test:unit
      # The seed's invariants: every value fits its field, every file opens. What the
      # previews of store changes fill themselves with, and checked nowhere else between
      # real loads.
      - run: pnpm --filter @unbent/seed test
      - run: pnpm build

  # The longest of the suites, split three ways so the other jobs are no longer waiting on
  # it. The whole suite is about three hundred CPU-seconds — 183 files, each building its
  # own jsdom — and a private repository's standard runner has two cores, so in one job it
  # took five to six minutes against under a minute on a laptop. vitest's own remedies
  # were measured and rejected: a shared environment (`isolate: false`) fails nearly two
  # hundred tests on module-level state that leaks between files, `vmThreads` fails seven
  # on `instanceof` across contexts, and `threads` runs in the same time as forks.
  #
  # Each shard does a third of the files and pays its own half-minute of install, so the
  # suite bills about a minute more in total and finishes in about two instead of six.
  # `--shard` slices a hash-sorted list, so a file always lands in the same shard and a
  # shard's failure is reproducible with the same flag. A matrix job's result, as `ci`
  # and `deploy` read it, is the worst of its shards; `fail-fast` is off so a failure in
  # one shard still shows what the others found.
  web-tests:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unbent/web test -- --shard=${{ matrix.shard }}/3

  # The per-account note store, tested inside workerd against real Durable Object
  # SQLite: schema, triggers, cascades and the bind limits a fake would not enforce.
  # Its own package because Cloudflare's vitest integration pins vitest 4; see
  # apps/store-tests/vitest.config.ts. Needs no build: the plugin tolerates the
  # missing assets directory the loaded wrangler environment names.
  store-tests:
    needs: changes
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @unbent/store-tests test

  # The one check the ruleset on `main` requires, so the ruleset never has to name the
  # jobs above and never goes stale when one is renamed or split. It always runs and
  # always reports — a required check that is skipped or never started blocks the merge
  # forever, which is how requiring the mirror's `test` job left every other pull request
  # unmergeable. A suite skipped because the change cannot reach it is a pass; a failed
  # or cancelled one, including `changes` itself, is not.
  ci:
    name: CI passed
    needs: [changes, check, web-tests, store-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every suite that ran passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  # Ships main to production: the top level of apps/api/wrangler.toml, on whichever
  # Cloudflare account the two secrets below belong to.
  #
  # Waits for every suite. On a push none is skipped (see `changes`), and if one ever were,
  # the implicit `success()` in this `if` would hold the deploy back rather than ship
  # unchecked — which is the side to fail on.
  deploy:
    needs: [check, web-tests, store-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Read by the source-map step below. At job level rather than on the step because
      # `secrets` is not available in a step's `if`, and the step has to be skippable: a
      # fork without these must still deploy.
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
      # Optional, and what makes a fork's very first push deploy a working instance with no
      # laptop involved. wrangler.toml declares BETTER_AUTH_SECRET required, and a Worker
      # that does not exist yet cannot have a secret put on it, so the first deploy has to
      # carry the value. Set this repository secret and the deploy step sends it along —
      # additively, so re-sending it on every push is harmless and a rotated value flows.
      # A Worker that already has the secret, as unbent.app's does, leaves this unset and
      # inherits.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      # Optional: the Android app-links document, for a repository that builds the app.
      # Sent the same way, and for the same reason it is not in a file — it names one
      # deployment's app.
      ANDROID_ASSET_LINKS: ${{ secrets.ANDROID_ASSET_LINKS }}
      # Optional: its iOS counterpart, the Apple App Site Association document, for the
      # same reason.
      APPLE_APP_SITE_ASSOCIATION: ${{ secrets.APPLE_APP_SITE_ASSOCIATION }}
      # Optional: the one origin this instance answers sign-in on, for a deployment with a
      # custom domain that wants its workers.dev name closed. Sent with the deploy rather
      # than put afterwards because a deploy replaces plain vars — and, once, because a var
      # of the same name has to be gone before a secret can take it, which only the upload
      # that drops the var can arrange.
      APP_URL: ${{ secrets.APP_URL }}
      # Optional: what the last step below sends to start the note-store sweep, since CI has
      # no session to start it with. Sent to the Worker with the deploy, the same way as the
      # values above, so the two ends cannot disagree. Unset, the step skips and the hourly
      # cron is what reaches every account after a deploy. `openssl rand -hex 32`.
      SWEEP_TOKEN: ${{ secrets.SWEEP_TOKEN }}
      # Optional, and a repository *variable*, not a secret: the R2 bucket the daily dumps
      # of every account's store go to (apps/api/src/lib/backups.ts). Set, the deploy binds
      # it as `BACKUPS` and the :47 cron starts dumping; unset, nothing is bound and the
      # run does nothing. Here rather than in wrangler.toml because the top level of that
      # file is what every fork deploys, and a fork must not start dumping into a bucket
      # its first deploy provisions without asking. Make the bucket first, with a lifecycle
      # rule on `stores/`; unbent.app's is `unbent-backups`, fourteen days.
      BACKUPS_BUCKET: ${{ vars.BACKUPS_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Before the deploy, and deliberately so: this rewrites the built JS with the chunk
      # ids PostHog matches a stack trace against, so the injected bundle has to be the one
      # that ships.
      - name: Upload source maps to PostHog
        if: env.POSTHOG_CLI_API_KEY != ''
        run: pnpm --filter @unbent/web sourcemaps

      # The deploy would provision the database by name, but migrations run first and a
      # database has to exist to be migrated. So on a repository whose account has none
      # yet — a fork's first push — this creates it, and everywhere else it is a no-op.
      # `d1 info` exits non-zero for a name the account does not have.
      - name: Make sure the database exists
        working-directory: apps/api
        run: |
          if ! pnpm exec wrangler d1 info unbent >/dev/null 2>&1; then
            echo "No D1 database named unbent on this account — creating it."
            pnpm exec wrangler d1 create unbent
          fi

      # Migrations before the Worker, and the order matters. The code in a PR is written for
      # the schema its migration produces, so a Worker deployed ahead of that migration
      # queries a table or column production does not yet have, and fails every request
      # that touches it until someone notices. The reverse gap, the old Worker on the new
      # schema for the seconds between these two steps, is the one a migration should be
      # written to tolerate: add before the code needs it, drop only after the code stopped
      # reading it.
      #
      # This used to be a manual `pnpm migrate:remote` before merging, which nothing
      # enforced, so a merged PR that carried a migration shipped code for a schema
      # production did not have. Wrangler applies only the files it has no record of, so
      # on a push with no new migration this is a no-op, and a failure here stops the job
      # before the Worker goes out.
      - name: Apply migrations to the production database
        working-directory: apps/api
        run: pnpm migrate:remote

      # `--env ""` says the top level of wrangler.toml is meant, which is also what stops
      # wrangler warning that other environments exist. The bucket is provisioned here on
      # the first deploy, by name.
      #
      # `printf` rather than `echo` so no trailing newline is read into the secret.
      #
      # The app-links value is JSON; `jq -c` folds it to one line, since the file is one
      # value per line, and refuses anything that is not JSON before it reaches the Worker.
      - name: Deploy Worker
        working-directory: apps/api
        env:
          # Where wrangler records what it deployed and to which addresses; the sweep below
          # reads the address from it.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          : > "$RUNNER_TEMP/secrets.env"
          if [ -n "$BETTER_AUTH_SECRET" ]; then
            printf 'BETTER_AUTH_SECRET=%s\n' "$BETTER_AUTH_SECRET" >> "$RUNNER_TEMP/secrets.env"
          fi
          if [ -n "$ANDROID_ASSET_LINKS" ]; then
            printf 'ANDROID_ASSET_LINKS=%s\n' "$(printf '%s' "$ANDROID_ASSET_LINKS" | jq -c .)" >> "$RUNNER_TEMP/secrets.env"
          fi
          if [ -n "$APPLE_APP_SITE_ASSOCIATION" ]; then
            printf 'APPLE_APP_SITE_ASSOCIATION=%s\n' "$(printf '%s' "$APPLE_APP_SITE_ASSOCIATION" | jq -c .)" >> "$RUNNER_TEMP/secrets.env"
          fi
          if [ -n "$APP_URL" ]; then
            printf 'APP_URL=%s\n' "$APP_URL" >> "$RUNNER_TEMP/secrets.env"
          fi
          if [ -n "$SWEEP_TOKEN" ]; then
            printf 'SWEEP_TOKEN=%s\n' "$SWEEP_TOKEN" >> "$RUNNER_TEMP/secrets.env"
          fi
          # The backups bucket, when one is named, as one more top-level binding in a copy
          # of the config written beside it, so its relative paths still resolve — the
          # same way the previews make their own-stores config. An array-of-tables entry
          # may follow any table in TOML, so appending it is enough.
          config=wrangler.toml
          if [ -n "$BACKUPS_BUCKET" ]; then
            # Pasted into TOML, so a stray quote or newline would fail as a parse error that
            # names neither the variable nor the problem. Bash's own match, on the whole
            # value: `grep` would pass a value with a newline in it whose last line looked
            # like a name.
            if ! [[ "$BACKUPS_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]]; then
              echo "::error::BACKUPS_BUCKET is not a valid R2 bucket name: $BACKUPS_BUCKET"
              exit 1
            fi
            config=wrangler.backups.toml
            cp wrangler.toml "$config"
            printf '\n[[r2_buckets]]\nbinding = "BACKUPS"\nbucket_name = "%s"\n' "$BACKUPS_BUCKET" >> "$config"
          fi
          if [ -s "$RUNNER_TEMP/secrets.env" ]; then
            pnpm exec wrangler deploy --config "$config" --env "" --secrets-file "$RUNNER_TEMP/secrets.env"
          else
            pnpm exec wrangler deploy --config "$config" --env ""
          fi
          rm -f "$RUNNER_TEMP/secrets.env"

      # Wakes every account's note store now, so a schema file this deploy carried is
      # applied everywhere within minutes, and a store it broke turns this job red rather
      # than waiting for the hourly cron to put it in a log nobody is watching. The
      # address is APP_URL when one is pinned, and otherwise the one the deploy recorded.
      # See scripts/sweep-stores.mjs.
      - name: Sweep the note stores
        if: env.SWEEP_TOKEN != ''
        run: node scripts/sweep-stores.mjs --origin "$APP_URL" --wrangler-output "$RUNNER_TEMP/wrangler-output.ndjson"
