name: Dev instance and previews

# unbent.app's own development tooling: a standing dev instance deployed from `main`, and a
# preview Worker per pull request. None of it is needed to run an instance, and production
# is deployed by web.yml, which is the whole of what a fork has to understand.
#
# A fork inherits this file without harm. Every job here decides first whether the
# repository has been given what it needs (the dev secrets, the workers.dev subdomain) and
# skips itself with a note in the run summary when it has not, rather than failing halfway
# through a deploy nobody asked for. The "The dev instance" section of docs/self-hosting.md
# says what to set to turn it on.
#
# Path-filtered the same way as web.yml, so an Android-only change deploys nothing here.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/previews.yml'
  pull_request:
    # `closed` is here only so a merged or abandoned PR's preview Worker gets deleted; the
    # preview job sits it out. The default list is the other three, and naming `closed`
    # means naming all of them.
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/previews.yml'

jobs:
  # The dev instance, `[env.dev]` in wrangler.toml, deployed from main behind production.
  #
  # Its own build rather than web.yml's artifact: sharing one would tie this file to that
  # one, and the point of the split is that a fork can read web.yml alone. The cost is a
  # second build on every push to main, on a repository whose CI minutes are free.
  dev:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Queued rather than cancelled mid-run, for the reason web.yml gives for production: a
    # deploy must finish. (A third push replaces one still waiting, which is fine; the
    # newest run ships everything.) Queued at all because the job ends in a sweep, and two
    # sweeps side by side move the same cursor, skip each other's batches and undercount,
    # and the second's restart would send the first back to the top mid-walk.
    concurrency:
      group: dev-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_BETTER_AUTH_SECRET: ${{ secrets.DEV_BETTER_AUTH_SECRET }}
      DEV_ALLOWED_EMAILS: ${{ secrets.DEV_ALLOWED_EMAILS }}
      # Who runs the dev instance and the previews, the shape of DEV_ALLOWED_EMAILS, sent
      # as the OPERATOR_EMAILS the Worker reads. Optional, and deliberately not implied by
      # the allowlist: being let in to sign in is not the same as being shown what only the
      # people running an instance can fix. Unset (a fork, or before anyone sets it),
      # nobody is an operator here, which is the Worker's own default; set, whatever
      # production shows its operators can be tried somewhere that is not production.
      #
      # Unsetting it later does not take it back: `--secrets-file` below only adds, so the
      # Worker keeps the last list until `wrangler secret delete OPERATOR_EMAILS --env dev`.
      DEV_OPERATOR_EMAILS: ${{ secrets.DEV_OPERATOR_EMAILS }}
      # The account's workers.dev subdomain, which the dev instance uses to recognise a
      # legitimate preview host before handing it a sign-in token. See the preview relay
      # in apps/api/src/lib/preview-relay.ts. The same variable the preview job reads to
      # build a preview's URL; unset, the relay simply stays off.
      WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      # Google on the dev instance, which is what the preview sign-in relay bounces to: a
      # preview cannot register its own OAuth callback, so the relay is only useful if
      # dev.unbent.app can actually sign in with Google. Both or neither, the same shape as
      # every other OAuth pair here; unset, the dev instance simply offers no Google button
      # and the relay falls back to the dev instance's other methods. Named `DEV_` so it can
      # be a separate client from production's, the way `DEV_BETTER_AUTH_SECRET` is.
      DEV_GOOGLE_CLIENT_ID: ${{ secrets.DEV_GOOGLE_CLIENT_ID }}
      DEV_GOOGLE_CLIENT_SECRET: ${{ secrets.DEV_GOOGLE_CLIENT_SECRET }}
      # Auto-fill on the dev instance. Optional, and a key of its own rather than
      # production's, so what the dev instance and the previews spend stays apart from what
      # unbent.app does, the same reason `DEV_BETTER_AUTH_SECRET` is not the production one.
      DEV_TYPESAFE_API_KEY: ${{ secrets.DEV_TYPESAFE_API_KEY }}
      # The vision model's key, for reading images; the same reasoning, the same shape.
      DEV_ANTHROPIC_API_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY }}
      # Paddle on the dev instance (MAK-108): the sandbox account's values, never the live
      # account's, so a checkout on dev.unbent.app takes a test card and moves no money.
      # All five or none, which is the Worker's own rule for them (`paddleOf`): with all
      # five, every account on dev starts a fortnight's trial and a lapsed one is refused
      # writes, which is the thing to try there before it is true on unbent.app. Only the
      # dev instance: the previews share dev's accounts and would need a webhook each.
      DEV_PADDLE_API_KEY: ${{ secrets.DEV_PADDLE_API_KEY }}
      DEV_PADDLE_WEBHOOK_SECRET: ${{ secrets.DEV_PADDLE_WEBHOOK_SECRET }}
      DEV_PADDLE_CLIENT_TOKEN: ${{ secrets.DEV_PADDLE_CLIENT_TOKEN }}
      DEV_PADDLE_PLAN_PRICE_ID: ${{ secrets.DEV_PADDLE_PLAN_PRICE_ID }}
      DEV_PADDLE_STORAGE_PRICE_ID: ${{ secrets.DEV_PADDLE_STORAGE_PRICE_ID }}
      # Optional; the same document production serves, so the Android app's passkeys work
      # against the dev instance and previews too.
      ANDROID_ASSET_LINKS: ${{ secrets.ANDROID_ASSET_LINKS }}
      # Optional; the iOS counterpart, for the iOS app's passkeys and links.
      APPLE_APP_SITE_ASSOCIATION: ${{ secrets.APPLE_APP_SITE_ASSOCIATION }}
      # The dev instance's own sweep token, for the sweep at the end of this job; see
      # SWEEP_TOKEN in web.yml. Not production's, so a leak of one is not the other. Unset,
      # that step skips. The previews get none: they have no accounts of their own worth
      # walking, their sweep is switched off (`STORE_SWEEP = "0"`), and so is their cron.
      DEV_SWEEP_TOKEN: ${{ secrets.DEV_SWEEP_TOKEN }}
    steps:
      # `secrets` cannot be read in an `if:`, so presence is decided once here, as an
      # output, and every later step reads it. The auth secret is the one that decides:
      # without it the Worker could deploy but never sign anyone in.
      - name: Is there a dev instance to deploy?
        id: configured
        run: |
          if [ -n "$DEV_BETTER_AUTH_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No DEV_BETTER_AUTH_SECRET repository secret. This repository has no dev instance. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm build

      # Migrations run before the deploy that would otherwise provision the database, so
      # on a repository whose account has none yet this creates it; elsewhere it is a no-op.
      - name: Make sure the dev database exists
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          if ! pnpm exec wrangler d1 info unbent-dev >/dev/null 2>&1; then
            echo "No D1 database named unbent-dev on this account. Creating it."
            pnpm exec wrangler d1 create unbent-dev
          fi

      # A PR's preview normally lands its migrations on the shared database before the PR
      # merges, so this is usually a no-op. Usually is not always: a fork PR gets no
      # preview, and a merge with checks skipped gets no preview either, and without this
      # the dev instance would then run main's code against a schema missing them.
      - name: Apply migrations to the dev database
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        run: pnpm migrate:dev

      # The secrets travel with the deploy rather than being put afterwards. wrangler.toml
      # declares BETTER_AUTH_SECRET required for this environment, and a required secret
      # has to be present when the Worker is created, which `secret put` cannot manage,
      # since it needs a Worker to exist first. `--secrets-file` is additive, so sending
      # the same values on every push is harmless and a rotated one flows through.
      #
      # `printf` rather than `echo` so no trailing newline is read into a value.
      - name: Deploy the dev instance
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          printf 'BETTER_AUTH_SECRET=%s\nALLOWED_EMAILS=%s\n' \
            "$DEV_BETTER_AUTH_SECRET" "$DEV_ALLOWED_EMAILS" > "$RUNNER_TEMP/dev-secrets.env"
          # Unset, nobody on the dev instance is an operator.
          if [ -n "$DEV_OPERATOR_EMAILS" ]; then
            printf 'OPERATOR_EMAILS=%s\n' "$DEV_OPERATOR_EMAILS" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          if [ -n "$ANDROID_ASSET_LINKS" ]; then
            printf 'ANDROID_ASSET_LINKS=%s\n' "$(printf '%s' "$ANDROID_ASSET_LINKS" | jq -c .)" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          if [ -n "$APPLE_APP_SITE_ASSOCIATION" ]; then
            printf 'APPLE_APP_SITE_ASSOCIATION=%s\n' "$(printf '%s' "$APPLE_APP_SITE_ASSOCIATION" | jq -c .)" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          # Google, both halves or neither: a lone id with no secret is not a working
          # provider, and `configuredSocials` ignores it, so sending only one would advertise
          # a button that fails when pressed. Mapped to the plain GOOGLE_* names the Worker
          # reads.
          if [ -n "$DEV_GOOGLE_CLIENT_ID" ] && [ -n "$DEV_GOOGLE_CLIENT_SECRET" ]; then
            printf 'GOOGLE_CLIENT_ID=%s\nGOOGLE_CLIENT_SECRET=%s\n' \
              "$DEV_GOOGLE_CLIENT_ID" "$DEV_GOOGLE_CLIENT_SECRET" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          # Unset, the dev instance draws no Auto-fill control and sends nothing anywhere.
          if [ -n "$DEV_TYPESAFE_API_KEY" ]; then
            printf 'TYPESAFE_API_KEY=%s\n' "$DEV_TYPESAFE_API_KEY" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          # Unset, the dev instance reads no images and sends nothing anywhere.
          if [ -n "$DEV_ANTHROPIC_API_KEY" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "$DEV_ANTHROPIC_API_KEY" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          # Paddle, all five or none: a partial set is a checkout that fails when pressed,
          # and the Worker treats one as none anyway. Unset, the dev instance sells no
          # plan and every account on it is active for good.
          if [ -n "$DEV_PADDLE_API_KEY" ] && [ -n "$DEV_PADDLE_WEBHOOK_SECRET" ] && [ -n "$DEV_PADDLE_CLIENT_TOKEN" ] \
            && [ -n "$DEV_PADDLE_PLAN_PRICE_ID" ] && [ -n "$DEV_PADDLE_STORAGE_PRICE_ID" ]; then
            printf 'PADDLE_API_KEY=%s\nPADDLE_WEBHOOK_SECRET=%s\nPADDLE_CLIENT_TOKEN=%s\nPADDLE_PLAN_PRICE_ID=%s\nPADDLE_STORAGE_PRICE_ID=%s\n' \
              "$DEV_PADDLE_API_KEY" "$DEV_PADDLE_WEBHOOK_SECRET" "$DEV_PADDLE_CLIENT_TOKEN" \
              "$DEV_PADDLE_PLAN_PRICE_ID" "$DEV_PADDLE_STORAGE_PRICE_ID" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          if [ -n "$DEV_SWEEP_TOKEN" ]; then
            printf 'SWEEP_TOKEN=%s\n' "$DEV_SWEEP_TOKEN" >> "$RUNNER_TEMP/dev-secrets.env"
          fi
          # The subdomain is what lets the dev instance validate a preview's return origin
          # before minting a sign-in token for it. A plain var rather than a secret: it is
          # public (it is in every preview's URL) and it is not per-PR. Omitted when the
          # repository runs no previews, which leaves the relay off with nothing to trust.
          relay_var=()
          if [ -n "$WORKERS_SUBDOMAIN" ]; then
            relay_var=(--var "PREVIEW_RELAY_SUBDOMAIN:$WORKERS_SUBDOMAIN")
          fi
          pnpm exec wrangler deploy --env dev "${relay_var[@]}" --secrets-file "$RUNNER_TEMP/dev-secrets.env"
          rm -f "$RUNNER_TEMP/dev-secrets.env"

      # The same last step as production's, for the same reason: a schema file that breaks
      # one of the dev instance's stores shows red here, on the push that carried it. The
      # address is the custom domain the deploy recorded. See scripts/sweep-stores.mjs.
      - name: Sweep the dev instance's note stores
        if: steps.configured.outputs.ready == 'true' && env.DEV_SWEEP_TOKEN != ''
        env:
          SWEEP_TOKEN: ${{ secrets.DEV_SWEEP_TOKEN }}
        run: node scripts/sweep-stores.mjs --wrangler-output "$RUNNER_TEMP/wrangler-output.ndjson"

  # One Worker per PR, at a URL of its own, so a branch can be tried out rather than read.
  #
  # The URL is built rather than parsed back out of wrangler's output, because APP_URL is
  # baked in at deploy time and the deploy therefore has to already know it. That works
  # because a workers.dev URL is exactly `<worker name>.<subdomain>.workers.dev`, and both
  # halves are known here.
  #
  # Not `needs: check`. That job is in web.yml and a job cannot need one in another file.
  # The check still runs on every PR and shows red on its own; a preview of a branch whose
  # tests fail is scratch data on a scratch database, and `pnpm build` below refuses code
  # that does not typecheck.
  preview:
    # Fork PRs get no secrets, so there is nothing to deploy with; they skip rather than
    # fail. The subdomain variable is the switch for a repository that has chosen not to
    # run previews at all: unset, the job skips, and the README says what it is for.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER_NAME: unbent-pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://unbent-pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_BETTER_AUTH_SECRET: ${{ secrets.DEV_BETTER_AUTH_SECRET }}
      DEV_ALLOWED_EMAILS: ${{ secrets.DEV_ALLOWED_EMAILS }}
      # The dev instance's operators, for the reason the dev job gives. A preview shares the
      # dev instance's database and its sign-in, so the same people run both.
      DEV_OPERATOR_EMAILS: ${{ secrets.DEV_OPERATOR_EMAILS }}
      # Optional; the same document production serves, so the Android app's passkeys work
      # against the dev instance and previews too.
      ANDROID_ASSET_LINKS: ${{ secrets.ANDROID_ASSET_LINKS }}
      # Optional; the iOS counterpart, for the iOS app's passkeys and links.
      APPLE_APP_SITE_ASSOCIATION: ${{ secrets.APPLE_APP_SITE_ASSOCIATION }}
      # The same development key the dev job carries, so a PR that touches Auto-fill can be
      # tried on its preview. Optional; unset, the preview draws no control.
      DEV_TYPESAFE_API_KEY: ${{ secrets.DEV_TYPESAFE_API_KEY }}
      DEV_ANTHROPIC_API_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY }}
      # The standing dev instance a preview borrows a Google session from (the origin its
      # login screen sends people to). unbent.app's own is dev.unbent.app, which is the
      # default; a fork with a differently-named dev instance overrides it with the
      # `DEV_INSTANCE_ORIGIN` repository variable. It only draws the relay button on the
      # preview; the dev side's own trust check is the subdomain the dev deploy sets.
      DEV_INSTANCE_ORIGIN: ${{ vars.DEV_INSTANCE_ORIGIN || 'https://dev.unbent.app' }}
      # Who runs the previews, so their front page has the built-in terms and privacy policy
      # beside its price, as production's does. Repository variables, with no default, rather
      # than values in `wrangler.toml`: a fork that deploys previews of its own would
      # otherwise publish this repository's operator on its pages, which is the bug the
      # documents' design exists to prevent. Unset, a preview publishes no documents.
      PREVIEW_OPERATOR_NAME: ${{ vars.PREVIEW_OPERATOR_NAME }}
      PREVIEW_OPERATOR_EMAIL: ${{ vars.PREVIEW_OPERATOR_EMAIL }}
    steps:
      # The subdomain is set but the secrets may not be; same gate as the dev job.
      - name: Are the preview secrets set?
        id: configured
        run: |
          if [ -n "$DEV_BETTER_AUTH_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_WORKERS_SUBDOMAIN is set but DEV_BETTER_AUTH_SECRET is not. A preview could deploy but never sign anyone in. Skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The checkout is GitHub's merge commit, which is on no branch; the account menu names
      # the PR's head instead, the commit the comment below says was deployed. See
      # `readBuildInfo` in apps/web/vite.config.ts.
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm build
        env:
          UNBENT_COMMIT: ${{ github.event.pull_request.head.sha }}

      # Migrations run before the deploy that would otherwise provision the database, so
      # on a repository whose account has none yet this creates it; elsewhere it is a no-op.
      - name: Make sure the shared preview database exists
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        run: |
          if ! pnpm exec wrangler d1 info unbent-dev >/dev/null 2>&1; then
            echo "No D1 database named unbent-dev on this account. Creating it."
            pnpm exec wrangler d1 create unbent-dev
          fi

      # Every preview shares one database, so this is the PR's migrations landing in it.
      - name: Apply migrations to the shared preview database
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        run: pnpm migrate:dev

      # A preview reads the dev instance's note stores, and those run `main`'s store code
      # (USER_STORE under [env.preview] in wrangler.toml). For a PR that changes that code,
      # the preview gets stores of its own instead, so the PR's code is what answers; they
      # start empty and the page offers to fill them with the seed. Decided by the PR's
      # files rather than a label, so nobody has to remember to ask. A rename counts from
      # either side, so a file moved out of `store/` is still a store change.
      - name: Does this PR change the note store?
        if: steps.configured.outputs.ready == 'true'
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if grep -q '^apps/api/src/store/' <<<"$files"; then
            echo "own=true" >> "$GITHUB_OUTPUT"
            echo "Changes apps/api/src/store/: this preview gets note stores of its own." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "own=false" >> "$GITHUB_OUTPUT"
          fi

      # `--name` replaces the Worker name outright; the secrets travel with the deploy for
      # the reason the dev job gives, and here it matters more, since every PR's first
      # deploy creates a Worker that has never had a secret.
      #
      # Stores of its own are the same config without the binding's `script_name`, written
      # beside wrangler.toml so its relative paths still resolve. Generated rather than a
      # second environment in the file, which would repeat every binding and drift from
      # this one; the count check stops a deploy that would quietly keep dev's stores if
      # the line were ever reworded.
      - name: Deploy the preview Worker
        if: steps.configured.outputs.ready == 'true'
        working-directory: apps/api
        env:
          OWN_STORES: ${{ steps.store.outputs.own }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'BETTER_AUTH_SECRET=%s\nALLOWED_EMAILS=%s\n' \
            "$DEV_BETTER_AUTH_SECRET" "$DEV_ALLOWED_EMAILS" > "$RUNNER_TEMP/preview-secrets.env"
          if [ -n "$DEV_OPERATOR_EMAILS" ]; then
            printf 'OPERATOR_EMAILS=%s\n' "$DEV_OPERATOR_EMAILS" >> "$RUNNER_TEMP/preview-secrets.env"
          fi
          if [ -n "$ANDROID_ASSET_LINKS" ]; then
            printf 'ANDROID_ASSET_LINKS=%s\n' "$(printf '%s' "$ANDROID_ASSET_LINKS" | jq -c .)" >> "$RUNNER_TEMP/preview-secrets.env"
          fi
          if [ -n "$APPLE_APP_SITE_ASSOCIATION" ]; then
            printf 'APPLE_APP_SITE_ASSOCIATION=%s\n' "$(printf '%s' "$APPLE_APP_SITE_ASSOCIATION" | jq -c .)" >> "$RUNNER_TEMP/preview-secrets.env"
          fi
          if [ -n "$DEV_TYPESAFE_API_KEY" ]; then
            printf 'TYPESAFE_API_KEY=%s\n' "$DEV_TYPESAFE_API_KEY" >> "$RUNNER_TEMP/preview-secrets.env"
          fi
          if [ -n "$DEV_ANTHROPIC_API_KEY" ]; then
            printf 'ANTHROPIC_API_KEY=%s\n' "$DEV_ANTHROPIC_API_KEY" >> "$RUNNER_TEMP/preview-secrets.env"
          fi
          # Point the preview's login screen at the dev instance for a Google session. Only
          # drawn when there is a dev instance to point at, which for this repository there
          # always is; a fork without one leaves DEV_INSTANCE_ORIGIN empty and the button off.
          relay_var=()
          if [ -n "$DEV_INSTANCE_ORIGIN" ]; then
            relay_var=(--var "PREVIEW_RELAY_ORIGIN:$DEV_INSTANCE_ORIGIN")
          fi
          # The operator, both or neither: half a pair would name a company with no way to
          # reach it, and the Worker publishes the documents only with both anyway.
          operator_var=()
          if [ -n "$PREVIEW_OPERATOR_NAME" ] && [ -n "$PREVIEW_OPERATOR_EMAIL" ]; then
            operator_var=(--var "OPERATOR_NAME:$PREVIEW_OPERATOR_NAME" --var "OPERATOR_EMAIL:$PREVIEW_OPERATOR_EMAIL")
          fi
          config=wrangler.toml
          own_var=()
          if [ "$OWN_STORES" = true ]; then
            binding='^script_name = "unbent-dev"$'
            if [ "$(grep -c "$binding" wrangler.toml)" != 1 ]; then
              echo "Expected exactly one '$binding' line in wrangler.toml to drop for stores of its own." >&2
              exit 1
            fi
            grep -v "$binding" wrangler.toml > wrangler.own-stores.toml
            config=wrangler.own-stores.toml
            own_var=(--var "PREVIEW_OWN_STORES:1")
          fi
          # The PR's number, so a tab of this preview reads "PR 222 · Unbent".
          pnpm exec wrangler deploy --config "$config" --env preview --name "$WORKER_NAME" \
            --var "APP_URL:$PREVIEW_URL" --var "INSTANCE_LABEL:PR $PR_NUMBER" \
            "${relay_var[@]}" "${operator_var[@]}" "${own_var[@]}" \
            --secrets-file "$RUNNER_TEMP/preview-secrets.env"
          rm -f "$RUNNER_TEMP/preview-secrets.env"

      # Edited in place rather than appended to, so a PR with thirty pushes has one comment.
      - name: Comment the preview URL
        if: steps.configured.outputs.ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OWN_STORES: ${{ steps.store.outputs.own }}
        with:
          script: |
            const marker = '<!-- unbent-preview -->';
            const relay = process.env.DEV_INSTANCE_ORIGIN;
            const signIn = relay
              ? [
                  `Sign in with **Continue on the dev instance**: a preview cannot register`,
                  `its own OAuth callback (its host changes every PR), so it borrows a Google`,
                  `session from ${relay} and comes back signed in. A password with an`,
                  `allowlisted address still works too.`,
                ]
              : [
                  'Sign in with a password and an allowlisted address: a preview offers no OAuth,',
                  'because a callback URL cannot be registered for a host that changes every PR.',
                ];
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            // Which stores this preview reads decides what its notes are, and a person
            // signing in to an empty preview should know why it is empty.
            const ownStores = process.env.OWN_STORES === 'true';
            const storeNote = ownStores
              ? [
                  '> [!NOTE]',
                  '> This PR changes `apps/api/src/store/`, so this preview keeps notes of its own',
                  '> and its store code is what runs. They start empty: **Fill with sample notes**',
                  '> on the empty list, or in Settings → Maintenance, adds invented ones.',
                  '',
                ]
              : [];
            // The link goes to /login rather than the root, which is the public front page
            // and only a click away from it. Someone already signed in is sent straight on
            // to their notes by the route's own check. The text stays the bare origin, so
            // the comment still says which Worker this is.
            const body = [
              marker,
              `### Preview: [${process.env.PREVIEW_URL}](${process.env.PREVIEW_URL}/login)`,
              '',
              ...storeNote,
              ...signIn,
              '',
              ...(ownStores
                ? [
                    `Runs against the shared \`unbent-dev\` database and bucket, so accounts and`,
                    'sign-in are the dev instance\'s; the notes are this preview\'s alone. Production',
                    'is untouched. The Worker is deleted when this PR closes.',
                  ]
                : [
                    `Runs against the shared \`unbent-dev\` database, bucket and note stores (the same`,
                    'notes as the dev instance), so what you change here changes there too. Production',
                    'is untouched. The Worker is deleted when this PR closes.',
                  ]),
              '',
              // Which push this URL is actually serving. Without it a stale comment and a
              // fresh one look identical, and the only way to tell whether a redeploy has
              // landed yet is to go and read the run log.
              `<sub>Worker \`${process.env.WORKER_NAME}\` · deployed ${context.payload.pull_request.head.sha.slice(0, 7)}</sub>`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The comment above is the only place the URL goes. A GitHub Deployment used to be
      # recorded as well, for the "View deployment" button in the PR's Deployments box, but
      # a deployment needs an environment, GitHub makes one per name on first use and the
      # workflow token can never delete one (`permissions:` has no `administration` key),
      # so Settings → Environments grew a `pr-N` row for every PR ever opened, close to two
      # hundred before anyone noticed, and nobody had noticed the button either. The
      # comment is edited in place on every push, so it does not scroll away.

  # Gated on the same variable as the preview job: a repository that never deploys previews
  # has nothing to tear down.
  preview-teardown:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLOUDFLARE_WORKERS_SUBDOMAIN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      WORKER_NAME: unbent-pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The base branch, not the PR: a merged PR's `refs/pull/N/merge` is deleted about as
      # soon as this event fires, and the delete below needs nothing from the PR anyway.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # No `--env preview`: a Worker is deleted by name, so the environment's bindings are
      # beside the point, and leaving it off means this keeps working from a base branch
      # whose wrangler.toml predates `[env.preview]`.
      #
      # Whatever the PR wrote lives on in the shared preview D1 and R2. That is the trade
      # a shared scratch instance makes; see the README on recreating it.
      #
      # A PR whose checks failed, or whose preview was skipped, never got as far as
      # deploying, so there may be nothing here to delete. Only that one case is forgiven
      # (10007 is wrangler's Worker-not-found), because a closed PR going red over a Worker
      # that never existed is noise, while a delete failing for any other reason is a
      # preview left running.
      - name: Delete the preview Worker
        working-directory: apps/api
        run: |
          status=0
          output="$(pnpm exec wrangler delete --name "$WORKER_NAME" --force 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s\n' "$output" | grep -q 'code: 10007'; then
              echo "::notice::No Worker named $WORKER_NAME. This PR never deployed a preview."
              exit 0
            fi
            exit "$status"
          fi
